name: Release

# Pushing to `main` (i.e. merging a PR) releases the mod — but only when `mod_version` is new:
#   1. Read `mod_version` from gradle.properties.
#   2. If a `v<mod_version>` release already exists, do nothing (non-version-bump merges are no-ops).
#   3. Otherwise build, create the `v<mod_version>` GitHub release, and publish to Modrinth, using the
#      matching `## [<mod_version>]` section of CHANGELOG.md as the changelog.
#
# So the changelog lives in CHANGELOG.md (one source of truth, player-facing) — never the PR body.
# To release: bump `mod_version` and add its CHANGELOG.md section in the PR, then merge.
# `workflow_dispatch` is available to re-run a release manually.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # create the release + tag

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mod_version
        id: ver
        run: echo "version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already released — nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.guard.outputs.skip == 'false'
        run: |
          ver="${{ steps.ver.outputs.version }}"
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          echo "----- release notes -----"; cat release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for $ver — release notes will be empty."
          fi

      - name: Set up JDK 25
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        if: steps.guard.outputs.skip == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: steps.guard.outputs.skip == 'false'
        run: chmod +x ./gradlew

      - name: Build
        if: steps.guard.outputs.skip == 'false'
        run: ./gradlew build --stacktrace

      - name: Create the GitHub release & publish to Modrinth
        if: steps.guard.outputs.skip == 'false'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ── Modrinth ────────────────────────────────────────────────
          modrinth-id: tJYeTacj
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # ── GitHub release (created at this tag by mc-publish) ───────
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ steps.ver.outputs.version }}

          # ── Artifact: primary mod jar only (skip dev/sources) ───────
          files: "build/libs/!(*-@(dev|sources|javadoc)).jar"

          # ── Metadata ────────────────────────────────────────────────
          name: Foundry v${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          changelog-file: release-notes.md
          version-type: release
          loaders: fabric
          game-versions: 26.1.2
          dependencies: |
            fabric-api(required)
