name: Release

# Publishes to Modrinth + GitHub Releases when you publish a GitHub Release, e.g. `v1.0.1`.
#
# Release flow:
#   1. Bump `mod_version` in gradle.properties (must match the tag, without the leading `v`).
#   2. Commit to main.
#   3. Create a GitHub Release (UI or `gh release create v1.0.1 ...`) — its tag creates the
#      version and its description becomes the Modrinth changelog (see `changelog` below).
#
# Triggering on `release: published` (rather than a raw tag push) means the release — and the
# description we want as the changelog — already exists when this job runs.

on:
  release:
    types: [ published ]

permissions:
  contents: write   # create the GitHub Release and attach the jar

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish to Modrinth & GitHub Releases
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ── Modrinth ────────────────────────────────────────────────
          modrinth-id: tJYeTacj
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # ── GitHub Release (auto-provided token) ────────────────────
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Artifact: primary mod jar only (skip dev/sources) ───────
          files: "build/libs/!(*-@(dev|sources|javadoc)).jar"

          # ── Metadata ────────────────────────────────────────────────
          name: Foundry ${{ github.ref_name }}
          changelog: ${{ github.event.release.body }}
          version-type: release
          loaders: fabric
          game-versions: 26.1.2
          dependencies: |
            fabric-api(required)
